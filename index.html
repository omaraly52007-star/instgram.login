<title>صفحة تسجيل دخول تجريبية</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #fafafa;
        font-family: Arial, sans-serif;
    }

    .login-box {
        width: 350px;
        padding: 35px 25px;
        background: white;
        border: 1px solid #dbdbdb;
        text-align: center;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 25px;
        color: #262626;
    }

    p {
        color: #737373;
        font-size: 14px;
    }

    input {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #dbdbdb;
        border-radius: 4px;
        background: #fafafa;
    }

    button {
        width: 100%;
        padding: 11px;
        margin-top: 10px;
        border: none;
        border-radius: 7px;
        background: #0095f6;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .notice {
        margin-top: 20px;
        font-size: 12px;
        line-height: 1.8;
    }
</style>
```

</head>

<body>

```
<main class="login-box">
    <h1>PhotoShare</h1>

    <p>صفحة تجريبية لتعلّم تصميم تسجيل الدخول</p>

    <form id="demoForm">
        <input
            type="text"
            placeholder="اسم مستخدم تجريبي"
            autocomplete="off"
            required
        >

        <input
            type="password"
            placeholder="كلمة مرور تجريبية"
            autocomplete="off"
            required
        >

        <button type="submit">تجربة تسجيل الدخول</button>
    </form>

    <p class="notice">
        مشروع تعليمي فقط.<br>
        لا تدخل بيانات حساباتك الحقيقية.
    </p>
</main>

<script>
    document.getElementById("demoForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            alert("نجحت تجربة الواجهة! لا يتم إنشاء حساب أو إرسال بيانات.");
        });
</script>
```

</body>
</html>
